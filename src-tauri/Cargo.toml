[package]
name = "nova-ai-file-manager"
version = "0.1.0"
description = "Local-first AI-powered desktop file manager"
authors = ["Nova AI File Manager contributors"]
edition = "2021"

[lib]
name = "nova_ai_file_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
open = "5"
